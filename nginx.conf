# Docker's DNS: node names are re-resolved, so a recreated container with a new IP address is found again
# (by default nginx resolves upstream names only once, at startup).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app_cluster {
    zone app_cluster 64k;
    # Round robin over the three nodes; a node that fails is skipped for 10 s.
    server app-node-1:8080 resolve max_fails=1 fail_timeout=10s;
    server app-node-2:8080 resolve max_fails=1 fail_timeout=10s;
    server app-node-3:8080 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;

    # Same limit as the application (spring.servlet.multipart.max-request-size).
    client_max_body_size 500m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CSV upload: stream the file to the node instead of spooling all of it on nginx first, and give the
    # node time to parse and store a large file before it answers.
    location = /api/payments/upload {
        proxy_pass http://app_cluster;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # GET /api/payments streams a JSON array; forward it as it is produced.
    location = /api/payments {
        proxy_pass http://app_cluster;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://app_cluster;
        proxy_read_timeout 120s;
    }
}
